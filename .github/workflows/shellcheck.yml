# This workflow will scan all *.sh files and report problems in the PR checks.
#   Runs on every push to main and PR targeting main.
#   Can be run manually via Actions → “ShellCheck (Bash Linting)” → Run workflow.

name: "ShellCheck (Bash Linting)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck (Bash)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read shared Go version
        id: versions
        run: |
          source scripts/test-tools.env
          echo "go=$TRICE_GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.versions.outputs.go }}

      # The local entry point selects the declared ShellCheck release and
      # retains the warning threshold and scratch-pad exclusion.
      - name: Run ShellCheck
        run: bash scripts/_410_test_shellcheck.sh
