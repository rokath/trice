
# This workflow runs on pull requests (and manually),
# fails the check if any shell script isn’t formatted according to shfmt style.
# 
# Developers can fix formatting locally by running:
# 
# ./scripts/_260_format_shell_scripts.sh format

name: "shfmt (Shell Formatting)"

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  shfmt:
    name: Check shell script formatting (shfmt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read shared Go version
        id: versions
        run: |
          source scripts/test-tools.env
          echo "go=$TRICE_GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - name: Run shfmt in check mode
        run: |
          export TRICE_TEST_AUTO_SETUP=1
          chmod +x ./scripts/_260_format_shell_scripts.sh
          ./scripts/_260_format_shell_scripts.sh check
