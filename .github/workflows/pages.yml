name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]          # Run this workflow on every push to the main branch
  workflow_dispatch:            # Allow manual triggering of the workflow from the GitHub UI
  workflow_run:
    workflows: ["Repository statistics"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read                # Required to read the repository contents
  pages: write                  # Required to write/deploy to GitHub Pages
  id-token: write               # Required for OIDC authentication used by deploy-pages@v4

concurrency:
  group: "pages"                # Ensure only one Pages deployment runs at a time
  cancel-in-progress: true      # Cancel any in-progress runs if a new one starts

jobs:
  build:
    # Only successful statistics runs from this repository may request a rebuild.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest      # Use the latest Ubuntu runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # This checks out the repository so subsequent steps can read README.md,
        # the UM, Guide and RM chapters in docs/, etc.

      - name: Generate index.md from README.md for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail

          # Create index.md with Jekyll front matter.
          # This file is NOT committed; it only exists in the build workspace
          # and becomes the site homepage on GitHub Pages.
          {
            echo '---'
            echo 'layout: default'
            echo '---'
            echo

            # Copy README.md, but rewrite documentation links under docs/
            # (with or without the ./ prefix and anchors) so they
            # target the rendered HTML page instead.
            #
            # Examples in README.md:
            #   [Manual](./docs/rm/README.md)
            #   [Speed](docs/rm/performance.md)
            #
            # All become (in index.md for Pages):
            #   ...](docs/rm/performance.html)
            sed -E 's@(\]\((\./)?docs/[^)]*)\.md([#?][^)]*)?\)@\1.html\3)@g' README.md
          } > index.md

      - name: Prepare documentation for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail

          # Documentation remains GitHub-friendly in the repo
          # with relative links like:
          #   [freedom](../internal/emitter/lineTransformerANSI.go)
          #   [Reference](./rm/structured_logging.md)
          #
          # Source links open the GitHub file view, with syntax highlighting and
          # blame. Links between documentation pages stay on the rendered site.
          #
          # Strategy:
          #   1. Resolve links relative to each source document's directory.
          #   2. Render docs/*.md destinations as HTML links.
          #   3. Open other repository destinations on GitHub.
          #
          # Notes:
          #   - Images and linked image previews keep their local resource paths.
          #   - Code examples and comments are preserved as authored.
          #   - Fragments and query strings survive the destination rewrite.
          python3 - <<'PY'
          from pathlib import Path
          import posixpath
          import re
          from urllib.parse import urlsplit

          # Require the active entry points before modifying any build copy.
          entry_points = [Path("docs/README.md"), Path("docs/TriceUserManual.md"), Path("docs/TriceGuide.md")]
          chapters = sorted(Path("docs/rm").glob("*.md"))
          missing = [path.as_posix() for path in [*entry_points, Path("docs/rm/README.md")] if not path.is_file()]
          if missing:
              raise SystemExit("ERROR: missing documentation source: " + ", ".join(missing))

          # Excluding nested labels prevents image previews from being mistaken
          # for ordinary links. Both the image and its surrounding link stay local.
          markdown_link = re.compile(r"(?<!!)\[[^\[\]\n]+\]\(([^)\n]+)\)")
          html_link = re.compile(r"\bhref\s*=\s*([\"'])(.*?)\1")

          def destination(value, document):
              # Local fragments and external URLs already have their final meaning.
              parsed = urlsplit(value)
              if not parsed.path or parsed.scheme or parsed.netloc or parsed.path.startswith("/"):
                  return value
              target = posixpath.normpath(posixpath.join(document.parent.as_posix(), parsed.path))
              if target.startswith("docs/") and target.endswith(".md"):
                  result = parsed.path[:-3] + ".html"
              else:
                  result = "https://github.com/rokath/trice/blob/main/" + target
              return result + ("?" + parsed.query if parsed.query else "") + ("#" + parsed.fragment if parsed.fragment else "")

          def rewrite(text, document):
              # Preserve fenced examples and complete commented test sections.
              lines = []
              fence = None
              in_comment = False
              for line in text.splitlines(keepends=True):
                  stripped = line.strip()
                  marker = re.match(r"(`{3,}|~{3,})", stripped)
                  if in_comment:
                      in_comment = "-->" not in line
                  elif fence:
                      if re.fullmatch(re.escape(fence[0]) + "{" + str(len(fence)) + ",}", stripped):
                          fence = None
                  elif marker:
                      fence = marker[1]
                  elif "<!--" in line:
                      in_comment = "-->" not in line[line.index("<!--") + 4:]
                  else:
                      # Inline code is excluded without excluding code-formatted
                      # link labels: only the link's starting position matters.
                      inline_code = [match.span() for match in re.finditer(r"(`+)(.*?)\1", line)]
                      def replace(match, group):
                          if any(start <= match.start() < end for start, end in inline_code):
                              return match[0]
                          start, end = match.span(group)
                          return match[0][:start - match.start()] + destination(match[group], document) + match[0][end - match.start():]
                      line = markdown_link.sub(lambda match: replace(match, 1), line)
                      # Recompute positions after Markdown destination lengths change.
                      inline_code = [match.span() for match in re.finditer(r"(`+)(.*?)\1", line)]
                      line = html_link.sub(lambda match: replace(match, 2), line)
                  lines.append(line)
              return "".join(lines)

          for document in [*entry_points, *chapters]:
              # Byte I/O preserves authored LF/CRLF and UTF-8, including a BOM.
              # Only link destinations may change in the disposable build copy.
              text = document.read_bytes().decode("utf-8")
              document.write_bytes(rewrite(text, document).encode("utf-8"))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6
        # Prepares the environment (paths, tokens, etc.) for the Pages build.

      - name: Prepare writable site output directory
        # Keep the output root owned by the runner so statistics can be added
        # after the Jekyll container creates the documentation files.
        shell: bash
        run: mkdir -p _site

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./             # Build from the repository root
          destination: ./_site   # Generated static site output

        # Jekyll will:
        # - Use _config.yml in the repository root.
        # - Use index.md (generated above) as the homepage.
        # - Render the UM, Guide and RM chapters (modified above) as separate pages.

      - name: Include repository statistics in the existing site
        shell: bash
        run: |
          set -euo pipefail

          # Before the first collection, keep publishing the documentation normally.
          stats_ref=$(git ls-remote --heads origin refs/heads/github-repo-stats)
          if [ -z "$stats_ref" ]; then
            echo "NOTICE: github-repo-stats branch is absent; publishing documentation without statistics."
            exit 0
          fi

          # Read only the generated report; never check out or run data-branch code.
          git fetch --no-tags --depth=1 origin refs/heads/github-repo-stats
          mkdir -p _statistics
          git archive FETCH_HEAD rokath/trice/latest-report | tar -x -C _statistics
          report="_statistics/rokath/trice/latest-report"
          if [ ! -s "$report/report.html" ]; then
            echo "::error::Expected a nonempty $report/report.html from github-repo-stats. Generated files:"
            find _statistics -type f
            exit 1
          fi

          # Add a separate subtree after Jekyll; existing documentation is untouched.
          mkdir -p _site/stats/report
          cp -R "$report/." _site/stats/report/

          # Optional until the first download collection; data-branch code is never run.
          downloads_link='<p>Release download charts will appear after the first download collection.</p>'
          downloads_report='rokath/trice/downloads/report'
          if git cat-file -e "FETCH_HEAD:$downloads_report" 2>/dev/null; then
            git archive FETCH_HEAD "$downloads_report" | tar -x -C _statistics
            for artifact in index.html by-release.svg over-time.svg; do
              if [ ! -s "_statistics/$downloads_report/$artifact" ]; then
                echo "::error::Expected a nonempty _statistics/$downloads_report/$artifact. Generated files:"
                find _statistics -type f
                exit 1
              fi
            done
            mkdir -p _site/stats/downloads
            cp -R "_statistics/$downloads_report/." _site/stats/downloads/
            downloads_link='<p><a href="downloads/">Release download charts: totals by release and over time</a></p>'
          fi
          cat > _site/stats/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Trice project statistics</title>
          </head>
          <body>
          <p><a href="../">Trice documentation</a></p>
          <h1>Project statistics</h1>
          <p><strong>GitHub activity statistics are not a count of unique Trice users. Automated access and repeated downloads are included.</strong></p>
          <p>Cumulative unique visitors and cloners add daily values; they are not unique people across the displayed period. Missing values may appear as zero. Historical stars and forks are reconstructed from entries that still exist.</p>
          <p>The unchanged upstream report shows its generation time in UTC. Release downloads are shown separately.</p>
          $downloads_link
          <p><a href="report/report.html">Open the full report</a></p>
          <iframe src="report/report.html" title="GitHub activity report" style="width:100%;height:80vh;border:0"></iframe>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site          # Upload the generated site as an artifact
        # This artifact is what the deploy job will publish to GitHub Pages.

  deploy:
    runs-on: ubuntu-latest
    needs: build                 # Only run deploy after build completes successfully
    environment:
      name: github-pages         # Special environment used by GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}  # Expose the deployed URL
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # This takes the uploaded artifact from the build job and
        # deploys it to GitHub Pages.
