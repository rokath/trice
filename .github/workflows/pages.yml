name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]          # Run this workflow on every push to the main branch
  workflow_dispatch:            # Allow manual triggering of the workflow from the GitHub UI
  workflow_run:
    workflows: ["Repository statistics"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read                # Required to read the repository contents
  pages: write                  # Required to write/deploy to GitHub Pages
  id-token: write               # Required for OIDC authentication used by deploy-pages@v4

concurrency:
  group: "pages"                # Ensure only one Pages deployment runs at a time
  cancel-in-progress: true      # Cancel any in-progress runs if a new one starts

jobs:
  build:
    # Only successful statistics runs from this repository may request a rebuild.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest      # Use the latest Ubuntu runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # This checks out the repository so subsequent steps can read README.md,
        # the UM, Guide and RM chapters in docs/, etc.

      - name: Prepare documentation for GitHub Pages
        run: |
          python3 scripts/_prepare_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v6
        # Prepares the environment (paths, tokens, etc.) for the Pages build.

      - name: Prepare writable site output directory
        # Keep the output root owned by the runner so statistics can be added
        # after the Jekyll container creates the documentation files.
        shell: bash
        run: mkdir -p _site

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./temp/pages-source # Same prepared tree as the local build
          destination: ./_site   # Generated static site output

        # Jekyll will:
        # - Use the staged _config.yml and unchanged, versioned index.md.
        # - Include the staged README as the homepage, without a second entry.
        # - Render staged documentation; authored files remain untouched.

      - name: Include repository statistics in the existing site
        shell: bash
        run: |
          set -euo pipefail

          # Before the first collection, keep publishing the documentation normally.
          stats_ref=$(git ls-remote --heads origin refs/heads/github-repo-stats)
          if [ -z "$stats_ref" ]; then
            echo "NOTICE: github-repo-stats branch is absent; publishing documentation without statistics."
            exit 0
          fi

          # Read only the generated report; never check out or run data-branch code.
          git fetch --no-tags --depth=1 origin refs/heads/github-repo-stats
          mkdir -p _statistics
          git archive FETCH_HEAD rokath/trice/latest-report | tar -x -C _statistics
          report="_statistics/rokath/trice/latest-report"
          if [ ! -s "$report/report.html" ]; then
            echo "::error::Expected a nonempty $report/report.html from github-repo-stats. Generated files:"
            find _statistics -type f
            exit 1
          fi

          # Add a separate subtree after Jekyll; existing documentation is untouched.
          mkdir -p _site/stats/report
          cp -R "$report/." _site/stats/report/

          # Optional until the first download collection; data-branch code is never run.
          downloads_link='<p>Release download charts will appear after the first download collection.</p>'
          downloads_report='rokath/trice/downloads/report'
          if git cat-file -e "FETCH_HEAD:$downloads_report" 2>/dev/null; then
            git archive FETCH_HEAD "$downloads_report" | tar -x -C _statistics
            for artifact in index.html by-release.svg over-time.svg; do
              if [ ! -s "_statistics/$downloads_report/$artifact" ]; then
                echo "::error::Expected a nonempty _statistics/$downloads_report/$artifact. Generated files:"
                find _statistics -type f
                exit 1
              fi
            done
            mkdir -p _site/stats/downloads
            cp -R "_statistics/$downloads_report/." _site/stats/downloads/
            downloads_link='<p><a href="downloads/">Release download charts: totals by release and over time</a></p>'
          fi
          cat > _site/stats/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Trice project statistics</title>
          </head>
          <body>
          <p><a href="../">Trice documentation</a></p>
          <h1>Project statistics</h1>
          <p><strong>GitHub activity statistics are not a count of unique Trice users. Automated access and repeated downloads are included.</strong></p>
          <p>Cumulative unique visitors and cloners add daily values; they are not unique people across the displayed period. Missing values may appear as zero. Historical stars and forks are reconstructed from entries that still exist.</p>
          <p>The unchanged upstream report shows its generation time in UTC. Release downloads are shown separately.</p>
          $downloads_link
          <p><a href="report/report.html">Open the full report</a></p>
          <iframe src="report/report.html" title="GitHub activity report" style="width:100%;height:80vh;border:0"></iframe>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site          # Upload the generated site as an artifact
        # This artifact is what the deploy job will publish to GitHub Pages.

  deploy:
    runs-on: ubuntu-latest
    needs: build                 # Only run deploy after build completes successfully
    environment:
      name: github-pages         # Special environment used by GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}  # Expose the deployed URL
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # This takes the uploaded artifact from the build job and
        # deploys it to GitHub Pages.
