name: TRICE Library CI (Nightly Quick)

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run nightly at 02:15 UTC (adjust to your preference).
    - cron: "15 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  guard_activity:
    name: Guard - skip if no commits in last 24h
    # PRs and explicit manual runs must not depend on recent main activity.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to run heavy CI
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="origin/main"

          echo "Default branch assumed: ${DEFAULT_BRANCH}"

          # Count commits in the last 24 hours on the default branch.
          COMMIT_COUNT="$(git log --since="24 hours ago" --pretty=oneline "${DEFAULT_BRANCH}" | wc -l | tr -d ' ')"
          echo "Commits in last 24h: ${COMMIT_COUNT}"

          if [ "${COMMIT_COUNT}" = "0" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  heavy_ci:
    # Preserve the existing required-check name; PRs now use the full matrix.
    name: Heavy CI (quick)
    needs: guard_activity
    # A skipped guard must not skip the required PR check. The status function
    # also permits this job to run after a skipped dependency, unless cancelled.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.guard_activity.outputs.should_run == 'true') }}
    uses: ./.github/workflows/trice_lib_reusable.yml
    with:
      # Validate every configuration before merging; nightly/manual Quick runs
      # retain their bounded selection. The Full workflow remains available too.
      configs_mode: ${{ github.event_name == 'pull_request' && 'full' || 'quick' }}
      configs_start: 0
      configs_end: 10

      # Keep your standard checks:
      toolchain_gcc_trice_on: true
      toolchain_gcc_trice_off: true
      toolchain_clang: true

      upload_artifacts: true
