name: Repository statistics

on:
  schedule:
    # Collect near the end of the UTC day to reduce partial-day samples.
    - cron: "43 23 * * *"
  workflow_dispatch:

# The upstream action uses its dedicated secret for both API reads and Git writes.
permissions: {}

concurrency:
  group: repository-statistics
  cancel-in-progress: false

jobs:
  collect:
    # Development branches and forks must not write to the shared data branch.
    if: github.repository == 'rokath/trice' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check statistics secret
        env:
          GHRS_TOKEN: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GHRS_TOKEN" ]; then
            echo "::error::Create the Actions secret GHRS_GITHUB_API_TOKEN; see docs/rm/maintenance.md#one-time-github-setup for permissions."
            exit 1
          fi

      - name: Collect data and generate the upstream report
        # Upstream v1.4.2, Apache-2.0; no local fork or custom collector.
        uses: jgehrcke/github-repo-stats@306db38ad131cab2aa5f2cd3062bf6f8aa78c1aa
        with:
          repository: rokath/trice
          databranch: github-repo-stats
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}

  downloads:
    # Wait until upstream has created/updated the data branch; use a fresh runner.
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout download report generator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout statistics data
        uses: actions/checkout@v7
        with:
          ref: github-repo-stats
          path: _download_data
          token: ${{ secrets.GHRS_GITHUB_API_TOKEN }}

      - name: Collect release downloads and render charts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/rokath/trice/releases?per_page=100' > _releases.json
          python3 scripts/github_downloads.py _releases.json _download_data/rokath/trice/downloads

      - name: Archive download snapshot and report
        shell: bash
        working-directory: _download_data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rokath/trice/downloads
          if git diff --cached --quiet; then
            echo 'Download statistics are unchanged.'
            exit 0
          fi
          git commit -m 'Update release download statistics'
          git push origin HEAD:github-repo-stats
