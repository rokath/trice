name: Script portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts (${{ matrix.os }})
    strategy:
      # Report every platform even when one detects a regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Preserve shell files on Windows; Git Bash must not receive CRLF scripts.
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test scripts on the native OS
        # These tests use disposable fixtures, including mocked installations.
        # Never invoke the complete compiler/firmware matrix in this job.
        run: go test -count=1 -timeout=15m ./scripts
