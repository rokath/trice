name: Native Trice runner

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      selection:
        type: string
        required: true
      race:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free space for pinned Linux toolchains
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          # Cold LLVM/GCC setup needs extraction space in addition to its cache.
          # These SDKs are unused by the native C/C++ and Go test plan.
          echo 'Removing unused hosted-runner Android and .NET SDKs before tool preparation.'
          df -h .
          if ! sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet; then
            echo '::error::Cannot free toolchain space: failed to remove unused SDKs at /usr/local/lib/android and /usr/share/dotnet.'
            exit 1
          fi
          df -h .
      - name: Read the shared tool versions
        id: versions
        run: |
          source scripts/test-tools.env
          printf 'go=%s\nnode=%s\npython=%s\n' "$TRICE_GO_VERSION" "$TRICE_NODE_VERSION" "$TRICE_PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          printf 'pandoc=%s\n' "$TRICE_TOOL_PANDOC_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.versions.outputs.go }}
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # The EPUB filter test executes the real converter on every native OS.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ steps.versions.outputs.pandoc }}
      - name: Restore verified project tools
        uses: actions/cache@v6
        with:
          path: temp/tools
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-tools.env', 'scripts/testcheck/package-lock.json', 'scripts/clang-intel-macos.lock') }}
      - name: Prepare native system prerequisites
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              # Compiler and CMake versions come from the shared manifest.
              sudo apt-get install -y build-essential xz-utils unzip python3-venv
              ;;
            macOS)
              # The suite selects genuine GCC and private LLVM. Apple's SDK
              # remains the source of native system headers and libraries.
              brew install gcc
              printf '%s/bin\n' "$(brew --prefix gcc)" >> "$GITHUB_PATH"
              ;;
            Windows)
              # testAll prepares one verified GCC/Clang/MinGW bundle when the
              # installed frontends do not pass the complete runtime probes.
              make --version
              ;;
          esac
      - name: Prepare prebuilt LLVM on Intel macOS
        if: ${{ runner.os == 'macOS' && runner.arch == 'X64' }}
        run: |
          set -euo pipefail
          source scripts/test-tools.env
          root="$PWD/temp/tools/clang-intel"
          bootstrap="$root/bootstrap"
          archive="$bootstrap/micromamba.tar.bz2"
          prefix="$root/env"
          selected="$root/bin"
          lock=scripts/clang-intel-macos.lock
          mkdir -p "$bootstrap"
          # Recheck restored bytes before executing the standalone installer.
          if ! printf '%s  %s\n' "$TRICE_TOOL_MICROMAMBA_SHA_DARWIN_AMD64" "$archive" | shasum -a 256 -c - >/dev/null 2>&1; then
            if ! curl -fL --retry 3 "$TRICE_TOOL_MICROMAMBA_URL_DARWIN_AMD64" -o "$archive"; then
              echo "::error::Intel LLVM preparation: cannot download $TRICE_TOOL_MICROMAMBA_URL_DARWIN_AMD64 to $archive."
              exit 1
            fi
          fi
          if ! printf '%s  %s\n' "$TRICE_TOOL_MICROMAMBA_SHA_DARWIN_AMD64" "$archive" | shasum -a 256 -c -; then
            echo "::error::Intel LLVM preparation: checksum mismatch for $archive."
            exit 1
          fi
          if ! tar -xf "$archive" -C "$bootstrap" bin/micromamba; then
            echo "::error::Intel LLVM preparation: cannot extract bin/micromamba from $archive."
            exit 1
          fi
          installer="$bootstrap/bin/micromamba"
          if [ "$("$installer" --version)" != "$TRICE_TOOL_MICROMAMBA_VERSION" ]; then
            echo "::error::Intel LLVM preparation: $installer must report $TRICE_TOOL_MICROMAMBA_VERSION."
            exit 1
          fi
          # Recreate only this environment, retaining downloaded package caches.
          # Relinking also repairs partial restores and prefixes from another job.
          rm -rf -- "$prefix"
          if ! "$installer" --no-rc --no-env create --yes --always-copy \
            --root-prefix "$root/cache" --prefix "$prefix" --file "$lock"; then
            echo "::error::Intel LLVM preparation failed using $lock; native tests have not started."
            exit 1
          fi
          # Expose only the three frontends, keeping imported formatters and
          # linker utilities out of other compiler families' PATH selections.
          mkdir -p "$selected"
          # Character classes match literal dots without Bash-dependent escaping.
          version_pattern="${TRICE_CLANG_DARWIN_AMD64_VERSION//./[.]}"
          for tool in clang clang++ clangd; do
            if [ ! -x "$prefix/bin/$tool" ]; then
              echo "::error::Intel LLVM preparation: missing executable $prefix/bin/$tool."
              exit 1
            fi
            ln -sf "$prefix/bin/$tool" "$selected/$tool"
            if ! "$selected/$tool" --version | grep -E "(^|[[:space:]])${version_pattern}([[:space:]]|$)"; then
              echo "::error::Intel LLVM preparation: $selected/$tool must report $TRICE_CLANG_DARWIN_AMD64_VERSION."
              exit 1
            fi
          done
          resource="$("$selected/clang" -print-resource-dir)"
          if [ ! -f "$resource/include/stddef.h" ]; then
            echo "::error::Intel LLVM preparation: missing compiler resource $resource/include/stddef.h."
            exit 1
          fi
          # Existing suite preparation selects this complete package in place.
          printf '%s\n' "$selected" >> "$GITHUB_PATH"
      - name: Run the native shared test plan
        run: bash scripts/testAll.sh '${{ inputs.selection }}'
      - name: Check concurrent host behavior
        if: ${{ !cancelled() && inputs.race }}
        run: |
          set -euo pipefail
          mkdir -p temp/log
          LOG_DIR="$(mktemp -d "$PWD/temp/log/race.XXXXXX")"
          export LOG_DIR
          source scripts/_100_test_common.sh
          init_logfile
          prepare_native_test_tools > "$LOG_DIR/tools.log" 2>&1
          run_go_tests -race -count=1 -timeout=20m ./internal/decoder ./internal/emitter ./internal/translator ./internal/vis
      - name: Upload native evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ inputs.runner }}-${{ inputs.selection }}
          path: temp/log
          if-no-files-found: error
